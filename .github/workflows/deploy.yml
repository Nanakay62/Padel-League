name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build & Deploy Web to Cloudflare Pages
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install Dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Export Expo Web Static
        working-directory: apps/mobile
        run: npx expo export --platform web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/mobile/dist --project-name=padel-ghana-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  docker-build:
    name: Build Production Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image (Dry-run Validation)
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          push: false
          tags: padel-ghana/api:latest

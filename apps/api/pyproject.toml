[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "phonenumbers>=9.0.40",
    "procrastinate>=3.10.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sentry-sdk>=2.71.0",
    "sqladmin>=0.32.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "structlog>=26.1.0",
    "tzdata>=2025.1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "hypothesis>=6.168.4",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "time-machine>=3.5.1",
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
